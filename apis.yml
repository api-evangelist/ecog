aid: ecog
name: EcoG
description: >-
  EcoG is a Munich-based technology company that builds the software and hardware platform powering
  electric-vehicle DC fast chargers. Its EcoG OS operating system, Universal Core platform, and
  controllers let charger manufacturers, charge point operators (CPOs), and EV businesses design,
  launch, and scale DC charging solutions with reduced complexity, claiming more than 15% market
  share in Europe with operations across India and North America. For developers, EcoG OS exposes an
  on-device programmatic surface (an OpenAPI-based application interface, a local web interface, and
  the LifeC remote management tool) so smart value-added charging applications can be built and run at
  the device level. This profile was surfaced as a Techstars portfolio company and enriched from
  EcoG's public website; it publishes no public REST API developer portal or specification.
